<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" width="900" height="780" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-label="Full runs (start to finish): share of each stage's points earned, by round">
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#111a22"/><line x1="0" y1="0" x2="0" y2="6" stroke="#8fa3b1" stroke-width="2"/></pattern></defs>
<rect width="900" height="780" fill="#111a22" rx="6"/>
